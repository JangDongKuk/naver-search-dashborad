[project]
name = "naver-search-dashboard"
version = "0.1.0"
description = "네이버 검색 API 기반 마켓 인사이트 EDA 대시보드"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.38",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "plotly>=5.24",
    "kiwipiepy>=0.18",
    "wordcloud>=1.9",
    "matplotlib>=3.9",
    "folium>=0.17",
    "streamlit-folium>=0.22",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
]

[tool.uv]
package = false

[tool.pyright]
# 모듈은 프로젝트 루트를 sys.path 에 추가하므로 `src.*` / `config.*` 절대 임포트가 유효하다.
extraPaths = ["."]

[tool.ruff]
line-length = 100
